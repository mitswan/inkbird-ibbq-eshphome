# Inkbird iBBQ thermometer integration for ESPHome
# Tested with IBT-6XS and IBT-2X (should work with other iBBQ models)
#
# Replace MAC addresses below with your own.
# You can find them by enabling the ble_scanner text sensor below.

# Ensure your ESP32 has enough BLE connection slots.
# Each ble_client needs one slot, plus bluetooth_proxy needs 3.
# e.g. 2 iBBQ devices + bluetooth_proxy = max_connections: 5
esp32_ble:
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# Uncomment to discover your iBBQ MAC address:
# text_sensor:
#   - platform: ble_scanner
#     name: "BLE Devices Scanner"

ble_client:
  # --- IBT-6XS (6 probes) ---
  - mac_address: "YOUR_IBT6XS_MAC_ADDRESS"
    id: ibt6xs_client
    on_connect:
      then:
        - delay: 2s
        # iBBQ pairing: 15-byte key to FFF2 (AccountAndVerify)
        - ble_client.ble_write:
            id: ibt6xs_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF2"
            value: [0x21, 0x07, 0x06, 0x05, 0x04, 0x03, 0x02, 0x01, 0xb8, 0x22, 0x00, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        # Enable realtime data on FFF5 (SettingsData)
        - ble_client.ble_write:
            id: ibt6xs_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x0B, 0x01, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        # Set units to Celsius on FFF5 (SettingsData)
        - ble_client.ble_write:
            id: ibt6xs_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x02, 0x00, 0x00, 0x00, 0x00, 0x00]
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ibbq", "IBT-6XS Disconnected!");
            id(ibt6xs_probe_1).publish_state(NAN);
            id(ibt6xs_probe_2).publish_state(NAN);
            id(ibt6xs_probe_3).publish_state(NAN);
            id(ibt6xs_probe_4).publish_state(NAN);
            id(ibt6xs_probe_5).publish_state(NAN);
            id(ibt6xs_probe_6).publish_state(NAN);

  # --- IBT-2X (2 probes) ---
  - mac_address: "YOUR_IBT2X_MAC_ADDRESS"
    id: ibt2x_client
    on_connect:
      then:
        - delay: 2s
        - ble_client.ble_write:
            id: ibt2x_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF2"
            value: [0x21, 0x07, 0x06, 0x05, 0x04, 0x03, 0x02, 0x01, 0xb8, 0x22, 0x00, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        - ble_client.ble_write:
            id: ibt2x_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x0B, 0x01, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        - ble_client.ble_write:
            id: ibt2x_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x02, 0x00, 0x00, 0x00, 0x00, 0x00]
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ibbq", "IBT-2X Disconnected!");
            id(ibt2x_probe_1).publish_state(NAN);
            id(ibt2x_probe_2).publish_state(NAN);

sensor:
  # --- IBT-6XS data listener ---
  - platform: ble_client
    type: characteristic
    ble_client_id: ibt6xs_client
    service_uuid: "FFF0"
    characteristic_uuid: "FFF4"
    notify: true
    update_interval: never
    id: ibt6xs_data_listener
    internal: true
    lambda: |-
      if (x.size() < 2) return 0;
      int num_probes = x.size() / 2;
      if (num_probes > 6) num_probes = 6;
      sensor::Sensor *sensors[] = {
        id(ibt6xs_probe_1), id(ibt6xs_probe_2), id(ibt6xs_probe_3),
        id(ibt6xs_probe_4), id(ibt6xs_probe_5), id(ibt6xs_probe_6)
      };
      int probes_connected = 0;
      for (int i = 0; i < num_probes; i++) {
        uint16_t raw = x[i*2] | (x[i*2+1] << 8);
        if (raw > 0 && raw < 60000) {
          sensors[i]->publish_state(raw / 10.0);
          probes_connected++;
        } else {
          sensors[i]->publish_state(NAN);
        }
      }
      for (int i = num_probes; i < 6; i++) {
        sensors[i]->publish_state(NAN);
      }
      return probes_connected;

  # --- IBT-2X data listener ---
  - platform: ble_client
    type: characteristic
    ble_client_id: ibt2x_client
    service_uuid: "FFF0"
    characteristic_uuid: "FFF4"
    notify: true
    update_interval: never
    id: ibt2x_data_listener
    internal: true
    lambda: |-
      if (x.size() < 2) return 0;
      int num_probes = x.size() / 2;
      if (num_probes > 2) num_probes = 2;
      sensor::Sensor *sensors[] = { id(ibt2x_probe_1), id(ibt2x_probe_2) };
      int probes_connected = 0;
      for (int i = 0; i < num_probes; i++) {
        uint16_t raw = x[i*2] | (x[i*2+1] << 8);
        if (raw > 0 && raw < 60000) {
          sensors[i]->publish_state(raw / 10.0);
          probes_connected++;
        } else {
          sensors[i]->publish_state(NAN);
        }
      }
      return probes_connected;

  # --- IBT-6XS probe sensors ---
  - platform: template
    name: "IBT-6XS Probe 1"
    id: ibt6xs_probe_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-6XS Probe 2"
    id: ibt6xs_probe_2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-6XS Probe 3"
    id: ibt6xs_probe_3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-6XS Probe 4"
    id: ibt6xs_probe_4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-6XS Probe 5"
    id: ibt6xs_probe_5
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-6XS Probe 6"
    id: ibt6xs_probe_6
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # --- IBT-2X probe sensors ---
  - platform: template
    name: "IBT-2X Probe 1"
    id: ibt2x_probe_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "IBT-2X Probe 2"
    id: ibt2x_probe_2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
