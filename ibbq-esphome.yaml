# Inkbird iBBQ thermometer integration for ESPHome
# Tested with IBT-6XS (should work with other iBBQ models)
#
# Replace YOUR_IBBQ_MAC_ADDRESS with the MAC address of your iBBQ device.
# You can find it by enabling the ble_scanner text sensor below.

# Ensure your ESP32 has enough BLE connection slots.
# If you use bluetooth_proxy, you'll need more (e.g. 4).
esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# Uncomment to discover your iBBQ MAC address:
# text_sensor:
#   - platform: ble_scanner
#     name: "BLE Devices Scanner"

ble_client:
  - mac_address: "YOUR_IBBQ_MAC_ADDRESS"
    id: ibbq_client
    on_connect:
      then:
        - delay: 2s
        # iBBQ pairing: 15-byte key to FFF2 (AccountAndVerify)
        - ble_client.ble_write:
            id: ibbq_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF2"
            value: [0x21, 0x07, 0x06, 0x05, 0x04, 0x03, 0x02, 0x01, 0xb8, 0x22, 0x00, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        # Enable realtime data on FFF5 (SettingsData)
        - ble_client.ble_write:
            id: ibbq_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x0B, 0x01, 0x00, 0x00, 0x00, 0x00]
        - delay: 500ms
        # Set units to Celsius on FFF5 (SettingsData)
        - ble_client.ble_write:
            id: ibbq_client
            service_uuid: "FFF0"
            characteristic_uuid: "FFF5"
            value: [0x02, 0x00, 0x00, 0x00, 0x00, 0x00]
    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ibbq", "Disconnected!");
            id(probe_1).publish_state(NAN);
            id(probe_2).publish_state(NAN);
            id(probe_3).publish_state(NAN);
            id(probe_4).publish_state(NAN);
            id(probe_5).publish_state(NAN);
            id(probe_6).publish_state(NAN);

sensor:
  # BLE notify listener on FFF4 (RealtimeData) - parses temperature notifications
  - platform: ble_client
    type: characteristic
    ble_client_id: ibbq_client
    service_uuid: "FFF0"
    characteristic_uuid: "FFF4"
    notify: true
    update_interval: never
    id: ibbq_data_listener
    internal: true
    lambda: |-
      if (x.size() < 2) return 0;

      int num_probes = x.size() / 2;
      if (num_probes > 6) num_probes = 6;

      sensor::Sensor *sensors[] = {
        id(probe_1), id(probe_2), id(probe_3),
        id(probe_4), id(probe_5), id(probe_6)
      };

      int probes_connected = 0;
      for (int i = 0; i < num_probes; i++) {
        uint16_t raw = x[i*2] | (x[i*2+1] << 8);
        if (raw > 0 && raw < 60000) {
          sensors[i]->publish_state(raw / 10.0);
          probes_connected++;
        } else {
          sensors[i]->publish_state(NAN);
        }
      }
      // Clear any remaining probes not reported
      for (int i = num_probes; i < 6; i++) {
        sensors[i]->publish_state(NAN);
      }
      return probes_connected;

  # Template sensors for each probe (adjust count to match your device)
  - platform: template
    name: "iBBQ Probe 1"
    id: probe_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "iBBQ Probe 2"
    id: probe_2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "iBBQ Probe 3"
    id: probe_3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "iBBQ Probe 4"
    id: probe_4
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "iBBQ Probe 5"
    id: probe_5
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "iBBQ Probe 6"
    id: probe_6
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
